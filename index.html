<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>진동시험기 예약</title>
<style>
  :root { --line:#e2e6ea; --bg:#f6f8fa; --pri:#2563eb; --pri-d:#1d4ed8;
          --free:#fff; --taken:#e8f0ff; --mine:#dbe8ff; --sel:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Malgun Gothic", "맑은 고딕", sans-serif;
         background:var(--bg); color:#1a2027; -webkit-text-size-adjust:100%; }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 4px; }
  .sub { color:#6b7684; font-size:13px; margin-bottom:16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px;
          padding:16px; margin-bottom:16px; }
  label { display:block; font-size:13px; font-weight:600; margin:10px 0 6px; }
  select, input[type=date], input[type=text], input[type=email], textarea {
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:15px; background:#fff; }
  textarea { min-height:56px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:140px; }
  .grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:12px; }
  .slot { border:1px solid var(--line); border-radius:8px; padding:8px 6px; text-align:center;
          cursor:pointer; user-select:none; background:var(--free); min-height:58px;
          display:flex; flex-direction:column; justify-content:center; transition:.12s; }
  .slot .t { font-size:13px; font-weight:700; }
  .slot .n { font-size:11px; color:#6b7684; margin-top:2px; word-break:break-all; }
  .slot.sel { background:var(--sel); border-color:var(--sel); color:#fff; }
  .slot.sel .n { color:#dbe8ff; }
  .slot.taken { background:var(--taken); cursor:pointer; }
  .slot.taken .n { color:#2563eb; font-weight:600; }
  .legend { display:flex; gap:14px; font-size:12px; color:#6b7684; margin-top:10px; flex-wrap:wrap; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .dot { width:12px; height:12px; border-radius:3px; border:1px solid var(--line); display:inline-block; }
  .dot.free{background:var(--free)} .dot.sel{background:var(--sel)} .dot.taken{background:var(--taken)}
  button { font-family:inherit; }
  .btn { width:100%; padding:13px; border:none; border-radius:10px; background:var(--pri);
          color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-top:14px; }
  .btn:hover { background:var(--pri-d); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .msg { margin-top:12px; padding:11px 13px; border-radius:8px; font-size:14px; display:none; }
  .msg.ok { background:#e6f6ec; color:#137a3a; display:block; }
  .msg.err { background:#fdeaea; color:#c0392b; display:block; }
  .msg.info { background:#eef2f7; color:#41505f; display:block; }
  .hint { font-size:12px; color:#8a94a0; margin-top:6px; }
  .lookup summary { cursor:pointer; font-weight:600; font-size:14px; }
  .lookrow { border-bottom:1px solid var(--line); padding:8px 0; font-size:13px;
             display:flex; justify-content:space-between; gap:10px; }
  .link { color:#c0392b; cursor:pointer; font-size:12px; white-space:nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>진동시험기 예약</h1>
  <div class="sub">이름으로 예약/취소하는 사내 공용 예약 시스템입니다.</div>

  <!-- ===== 조회 조건 ===== -->
  <div class="card">
    <div class="row">
      <div>
        <label>장비</label>
        <select id="machine"></select>
      </div>
      <div>
        <label>날짜</label>
        <input type="date" id="date" />
      </div>
    </div>

    <label style="margin-top:14px">시간 선택 (08~19시 · 빈칸 클릭=예약선택, 예약됨 클릭=취소)</label>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><i class="dot free"></i>예약가능</span>
      <span><i class="dot sel"></i>선택됨</span>
      <span><i class="dot taken"></i>예약됨</span>
    </div>
  </div>

  <!-- ===== 예약 폼 ===== -->
  <div class="card">
    <div class="row">
      <div>
        <label>이름 <span style="color:#c0392b">*</span></label>
        <input type="text" id="name" placeholder="예약자 이름" />
      </div>
      <div>
        <label>부서 / 연락처</label>
        <input type="text" id="dept" placeholder="선택" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>이메일</label>
        <input type="email" id="email" placeholder="선택" />
      </div>
    </div>
    <label>메모</label>
    <textarea id="memo" placeholder="선택"></textarea>

    <button class="btn" id="reserveBtn">예약하기</button>
    <div class="hint">한 번에 최대 8시간까지, 연속된 시간만 예약할 수 있습니다.</div>
    <div class="msg" id="msg"></div>
  </div>

  <!-- ===== (선택) 기간+이름 조회 ===== -->
  <div class="card">
    <details class="lookup">
      <summary>내 예약 조회 (기간 + 이름)</summary>
      <div class="row" style="margin-top:12px">
        <div><label>시작일</label><input type="date" id="lkFrom" /></div>
        <div><label>종료일</label><input type="date" id="lkTo" /></div>
        <div><label>이름</label><input type="text" id="lkName" placeholder="이름" /></div>
      </div>
      <button class="btn" id="lookupBtn" style="background:#41505f">조회</button>
      <div id="lookupResult" style="margin-top:12px"></div>
    </details>
  </div>

  <!-- 통계/CSV/반복예약은 생략 — 확장 가능 -->
</div>

<script type="module">
// ============================================================
//  Supabase 설정
//  ▼▼▼  아래 두 값을 본인 프로젝트 값으로 채우세요  ▼▼▼
//  얻는 곳: Supabase 대시보드 > 프로젝트 > Settings > API
//    - Project URL          → SUPABASE_URL
//    - Project API keys / anon public → SUPABASE_ANON_KEY
// ============================================================
const SUPABASE_URL = 'https://kgycsklywvbgoexdroii.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_CtyeWm_Cn9r6WggFauYR1A_N4uaTXeI';

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== 앱 설정 =====
const CONFIG = {
  machines: ['진동시험기 1호'],
  startHour: 8,   // 첫 예약 가능 시각
  endHour: 20,    // 마지막 경계(예약 가능 시각은 8..19)
  maxHours: 8     // 연속 최대 예약 시간
};

// ===== DOM =====
const $ = (id) => document.getElementById(id);
const machineSel = $('machine'), dateInput = $('date'), grid = $('grid'), msg = $('msg');
let taken = {};              // { hour: {id, name} }
let selected = new Set();    // 선택된 hour 집합

// 장비 채우기
CONFIG.machines.forEach(m => {
  const o = document.createElement('option'); o.value = m; o.textContent = m;
  machineSel.appendChild(o);
});
if (CONFIG.machines.length === 1) machineSel.disabled = true; // 1개면 고정 표시

// 날짜 기본 = 오늘
function todayStr() {
  const d = new Date(); const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
dateInput.value = todayStr();

function twoDigit(n){ return String(n).padStart(2,'0'); }
function hourLabel(h){ return `${twoDigit(h)}:00~${twoDigit(h+1)}:00`; }

function showMsg(text, type){ msg.className = 'msg ' + type; msg.textContent = text; }
function clearMsg(){ msg.className = 'msg'; msg.textContent=''; }

// ===== 예약현황 조회 → 그리드 렌더 =====
async function loadGrid(){
  selected.clear();
  grid.innerHTML = '<div style="grid-column:1/-1;color:#8a94a0;font-size:13px">불러오는 중…</div>';
  const machine = machineSel.value, date = dateInput.value;
  const { data, error } = await sb
    .from('reservations')
    .select('id, hour, name')
    .eq('machine', machine)
    .eq('date', date);

  if (error){ grid.innerHTML=''; showMsg('현황 조회 실패: ' + error.message, 'err'); return; }

  taken = {};
  (data || []).forEach(r => { taken[r.hour] = { id: r.id, name: r.name }; });
  renderGrid();
}

function renderGrid(){
  grid.innerHTML = '';
  for (let h = CONFIG.startHour; h < CONFIG.endHour; h++){
    const cell = document.createElement('div');
    cell.className = 'slot';
    const t = document.createElement('div'); t.className='t'; t.textContent = twoDigit(h)+'시';
    const n = document.createElement('div'); n.className='n';
    cell.appendChild(t); cell.appendChild(n);

    if (taken[h]){
      cell.classList.add('taken');
      n.textContent = taken[h].name;
      cell.title = hourLabel(h) + ' · ' + taken[h].name + ' (클릭하면 취소)';
      cell.onclick = () => cancelReservation(h);
    } else {
      n.textContent = '예약가능';
      cell.title = hourLabel(h) + ' (클릭하면 선택)';
      cell.onclick = () => toggleSelect(h, cell);
      if (selected.has(h)) cell.classList.add('sel');
    }
    grid.appendChild(cell);
  }
}

function toggleSelect(h, cell){
  if (selected.has(h)){ selected.delete(h); cell.classList.remove('sel'); }
  else { selected.add(h); cell.classList.add('sel'); }
  clearMsg();
}

// ===== 예약 =====
async function reserve(){
  clearMsg();
  const name = $('name').value.trim();
  const hours = [...selected].sort((a,b)=>a-b);

  // --- 검증 ---
  if (!name){ showMsg('이름을 입력하세요.', 'err'); return; }
  if (hours.length === 0){ showMsg('예약할 시간을 하나 이상 선택하세요.', 'err'); return; }
  if (hours.length > CONFIG.maxHours){ showMsg(`한 번에 최대 ${CONFIG.maxHours}시간까지 예약할 수 있습니다.`, 'err'); return; }
  // 연속성 검사
  for (let i=1; i<hours.length; i++){
    if (hours[i] !== hours[i-1] + 1){ showMsg('연속된 시간만 예약할 수 있습니다.', 'err'); return; }
  }

  const machine = machineSel.value, date = dateInput.value;
  const dept = $('dept').value.trim() || null;
  const memo = $('memo').value.trim() || null;
  const email = $('email').value.trim() || null;

  const rows = hours.map(h => ({ machine, date, hour: h, name, dept, memo, email }));

  $('reserveBtn').disabled = true;
  showMsg('예약 처리 중…', 'info');

  // 여러 행을 한번에 insert. UNIQUE 제약 위반(=이미 예약됨)이면 전체 실패(원자적).
  const { error } = await sb.from('reservations').insert(rows);

  $('reserveBtn').disabled = false;

  if (error){
    // 23505 = unique_violation → 그 사이 누군가 선점
    if (error.code === '23505' || /duplicate|unique/i.test(error.message)){
      showMsg('선택한 시간 중 이미 예약된 시간이 있어 예약이 취소되었습니다. 현황을 확인하세요.', 'err');
    } else {
      showMsg('예약 실패: ' + error.message, 'err');
    }
    await loadGrid();
    return;
  }

  showMsg(`예약 완료: ${date} ${hours.map(twoDigit).join(', ')}시 (${name})`, 'ok');
  $('memo').value = '';
  await loadGrid();
}

// ===== 취소 =====
async function cancelReservation(h){
  const rec = taken[h];
  if (!rec) return;
  const inputName = prompt(`${hourLabel(h)} 예약(${rec.name})을 취소합니다.\n예약자 이름을 입력하세요:`);
  if (inputName === null) return;            // 취소 버튼
  if (inputName.trim() !== rec.name){
    showMsg('이름이 일치하지 않아 취소할 수 없습니다.', 'err');
    return;
  }
  // 이름까지 일치하는 행만 삭제 (안전)
  const { error } = await sb
    .from('reservations')
    .delete()
    .eq('id', rec.id)
    .eq('name', rec.name);

  if (error){ showMsg('취소 실패: ' + error.message, 'err'); return; }
  showMsg(`취소 완료: ${hourLabel(h)} (${rec.name})`, 'ok');
  await loadGrid();
}

// ===== (선택) 기간+이름 조회 =====
async function lookup(){
  const from = $('lkFrom').value, to = $('lkTo').value, name = $('lkName').value.trim();
  const box = $('lookupResult');
  if (!from || !to || !name){ box.innerHTML = '<div style="color:#c0392b;font-size:13px">시작일·종료일·이름을 모두 입력하세요.</div>'; return; }
  box.innerHTML = '조회 중…';
  const { data, error } = await sb
    .from('reservations')
    .select('id, date, hour, machine, name')
    .eq('name', name)
    .gte('date', from)
    .lte('date', to)
    .order('date').order('hour');

  if (error){ box.innerHTML = '<div style="color:#c0392b">조회 실패: '+error.message+'</div>'; return; }
  if (!data || data.length === 0){ box.innerHTML = '<div style="color:#8a94a0;font-size:13px">해당 예약이 없습니다.</div>'; return; }

  box.innerHTML = '';
  data.forEach(r => {
    const row = document.createElement('div'); row.className='lookrow';
    const left = document.createElement('span');
    left.textContent = `${r.date} ${hourLabel(r.hour)} · ${r.machine}`;
    const del = document.createElement('span'); del.className='link'; del.textContent='취소';
    del.onclick = async () => {
      const { error } = await sb.from('reservations').delete().eq('id', r.id).eq('name', name);
      if (error){ alert('취소 실패: '+error.message); return; }
      row.remove();
      if (r.date === dateInput.value && r.machine === machineSel.value) loadGrid();
    };
    row.appendChild(left); row.appendChild(del);
    box.appendChild(row);
  });
}

// ===== 이벤트 =====
machineSel.addEventListener('change', loadGrid);
dateInput.addEventListener('change', loadGrid);
$('reserveBtn').addEventListener('click', reserve);
$('lookupBtn').addEventListener('click', lookup);

// 초기 로드
loadGrid();
</script>
</body>
</html>
